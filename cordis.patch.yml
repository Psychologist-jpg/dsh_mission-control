- insert:
    - id: mission-control
      name: '@local/mission-control'
      config:
        pollIntervalMs: 15000
        warnRatio: 0.65
        handoffRatio: 0.85
        defaultCap: 3
        freshProvider: spawn
        maxHandoffRounds: 3
        # 蜂巢开关是子会话的唯一入口：未开启时拒绝 subagent / subagent_fork / workflow
        blockDelegationOutsideHive: true